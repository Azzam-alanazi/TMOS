<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T.M.O.S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ── Reset ────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Variables ────────────────────────────────────────────────────────────── */
:root {
  --cyan:    #00e5ff;
  --dark:    #020b14;
  --panel:   #040f1e;
  --red:     #ff4444;
  --green:   #00ff88;
  --orange:  #ffaa00;
  --purple:  #b388ff;
  --text:    #b0d8e8;
  --dim:     #7ab8cc;
  --border:  #0d3a52;
  --track:   #0d2535;
  --mono:    'Share Tech Mono', 'Consolas', monospace;
  --head:    'Orbitron', 'Consolas', monospace;
}

html, body {
  height: 100%;
  background: var(--dark);
  color: var(--text);
  font-family: var(--mono);
  overflow: hidden;
  user-select: none;
}

/* Grid BG */
body {
  background-image:
    linear-gradient(rgba(0,229,255,.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,.028) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* Scanlines */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,.035) 2px, rgba(0,0,0,.035) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* ── Layout ─────────────────────────────────────────────────────────────── */
.root { display: flex; flex-direction: column; height: 100vh; }

.content {
  display: grid;
  grid-template-columns: 1fr 2fr 1fr;
  gap: 8px;
  padding: 8px 8px 4px;
  flex: 1;
  min-height: 0;
}

.panel { display: flex; flex-direction: column; gap: 8px; min-height: 0; }

/* ── Card ────────────────────────────────────────────────────────────────── */
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  position: relative;
  overflow: hidden;
}

.card::before, .card::after {
  content: '';
  position: absolute;
  width: 10px;
  height: 10px;
}
.card::before {
  top: -1px; left: -1px;
  border-top: 2px solid var(--cyan);
  border-left: 2px solid var(--cyan);
}
.card::after {
  bottom: -1px; right: -1px;
  border-bottom: 2px solid var(--cyan);
  border-right: 2px solid var(--cyan);
}

.card-title {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 2.5px;
  color: var(--cyan);
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.fill { display: flex; flex-direction: column; flex: 1; min-height: 0; }

/* ── Tabs ────────────────────────────────────────────────────────────────── */
.tab-bar { display: flex; gap: 2px; margin-bottom: 8px; }

.tab-btn {
  flex: 1;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px 4px 0 0;
  color: var(--dim);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 5px 4px;
  cursor: pointer;
  transition: all .15s;
}
.tab-btn:hover { color: var(--cyan); border-color: var(--cyan); }
.tab-btn.active {
  background: rgba(0,229,255,.08);
  color: var(--cyan);
  border-color: var(--cyan);
  border-bottom-color: var(--panel);
}

.tab-content { display: none; flex: 1; min-height: 0; overflow: hidden; flex-direction: column; }
.tab-content.active { display: flex; }

/* ── STATS ───────────────────────────────────────────────────────────────── */
.stat-bar { margin-bottom: 10px; }

.stat-label {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: var(--dim);
  letter-spacing: 1px;
  margin-bottom: 3px;
}
.stat-label b { color: var(--cyan); font-weight: normal; }

.stat-track {
  height: 7px;
  background: var(--track);
  border-radius: 4px;
  border: 1px solid #112840;
  overflow: hidden;
  position: relative;
}

.stat-fill {
  height: 100%;
  border-radius: 4px;
  transition: width .6s ease, background .4s;
  background: linear-gradient(90deg, #005577, var(--cyan));
  position: relative;
}
.stat-fill::after {
  content: '';
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 3px;
  background: rgba(0,229,255,.9);
  box-shadow: 0 0 8px rgba(0,229,255,.7);
}
.stat-fill.warn { background: linear-gradient(90deg, #664400, var(--orange)); }
.stat-fill.warn::after { background: rgba(255,170,0,.9); box-shadow: 0 0 8px rgba(255,170,0,.7); }
.stat-fill.high { background: linear-gradient(90deg, #550000, var(--red)); }
.stat-fill.high::after { background: rgba(255,68,68,.9); box-shadow: 0 0 8px rgba(255,68,68,.7); }

.info-row, .battery-row { font-size: 9px; color: var(--dim); margin-top: 5px; letter-spacing: .5px; }
.battery-row { display: flex; align-items: center; gap: 6px; }
.battery-icon { font-size: 12px; }

/* ── LOG ─────────────────────────────────────────────────────────────────── */
.log-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }

.log-entry {
  font-size: 9px;
  line-height: 1.5;
  padding: 2px 0;
  border-bottom: 1px solid rgba(13,58,82,.3);
  animation: fadeIn .25s ease;
}

.tag-sys  { color: var(--cyan); }
.tag-ok   { color: var(--green); }
.tag-warn { color: var(--orange); }
.tag-err  { color: var(--red); }

@keyframes fadeIn { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; } }

/* ══════════════════════════════════════════════════════════════════════════ */
/*  WEB-LIKE ORB  — animated network/spider web that pulses when active      */
/* ══════════════════════════════════════════════════════════════════════════ */
.orb-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 10px 10px;
}

/* ════════════════════════════════════════════════════════════════════════
   ◆  SCI-FI ORB — HUD web, bezier arcs, energy pulses, spectrum ring
   ════════════════════════════════════════════════════════════════════════ */
.web-wrap {
  position: relative;
  width: 200px;
  height: 200px;
  --accent: var(--cyan);
  --accent-rgb: 0,229,255;
  filter: drop-shadow(0 0 14px rgba(var(--accent-rgb), 0.35));
  transition: filter .4s;
}
.web-wrap.speaking   { --accent: var(--cyan);   --accent-rgb: 0,229,255;   filter: drop-shadow(0 0 24px rgba(var(--accent-rgb), 0.75)); }
.web-wrap.listening  { --accent: var(--green);  --accent-rgb: 0,230,118;   filter: drop-shadow(0 0 18px rgba(var(--accent-rgb), 0.55)); }
.web-wrap.processing { --accent: var(--orange); --accent-rgb: 255,152,0;   filter: drop-shadow(0 0 18px rgba(var(--accent-rgb), 0.55)); }

.web-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  position: absolute; inset: 0;
}

/* Background halo — subtle pulsing glow behind everything */
.web-halo {
  position: absolute;
  inset: 10%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--accent-rgb), 0.18) 0%, transparent 70%);
  animation: halo-breathe 4s ease-in-out infinite;
  pointer-events: none;
}
.web-wrap.speaking .web-halo { animation-duration: 1.4s; }
@keyframes halo-breathe {
  0%,100% { transform: scale(0.85); opacity: 0.6; }
  50%     { transform: scale(1.1);  opacity: 1;   }
}

/* ── Outer HUD ring with tick marks (rotates CCW) ─────────────────────── */
.hud-outer {
  transform-origin: 100px 100px;
  animation: rotate-ccw 45s linear infinite;
}
.web-wrap.speaking .hud-outer { animation-duration: 12s; }
.hud-tick { stroke: var(--accent); stroke-width: 1.2; opacity: .55; }
.hud-tick-major { stroke-width: 2; opacity: 0.9; }
.hud-outer-ring {
  fill: none;
  stroke: var(--accent);
  stroke-width: 1;
  opacity: 0.35;
  stroke-dasharray: 3 3;
}

/* ── Inner HUD ring with corner brackets (rotates CW) ─────────────────── */
.hud-inner {
  transform-origin: 100px 100px;
  animation: rotate-cw 25s linear infinite;
}
.web-wrap.speaking .hud-inner { animation-duration: 7s; }
.hud-bracket { stroke: var(--accent); stroke-width: 1.5; fill: none; opacity: 0.85; stroke-linecap: round; }

/* ── Web structure (spokes + rings + nodes) rotates slowly ────────────── */
.web-rotate-group {
  transform-origin: 100px 100px;
  animation: rotate-cw 30s linear infinite;
}
.web-wrap.speaking   .web-rotate-group { animation-duration: 9s;  }
.web-wrap.listening  .web-rotate-group { animation-duration: 18s; }
.web-wrap.processing .web-rotate-group { animation-duration: 6s;  }

.web-spoke {
  stroke: var(--accent);
  stroke-width: 0.7;
  opacity: 0.3;
  transition: opacity .4s, stroke-width .4s;
  stroke-linecap: round;
}
.web-ring {
  fill: none;
  stroke: var(--accent);
  stroke-width: 0.7;
  opacity: 0.35;
  stroke-dasharray: 2 4;
  transition: opacity .4s, stroke-width .4s;
}
.web-node {
  fill: var(--accent);
  opacity: 0.65;
  transition: all .3s;
}

/* Bezier arcs between random nodes — always morphing */
.web-arc {
  fill: none;
  stroke: var(--accent);
  stroke-width: 0.6;
  opacity: 0.4;
  stroke-linecap: round;
  transition: opacity .3s;
}
.web-wrap.speaking .web-arc { opacity: 0.9; stroke-width: 1; }

/* Energy pulses — particles travelling along spokes (shown when speaking) */
.energy-pulse {
  fill: var(--accent);
  opacity: 0;
  filter: url(#soft-glow);
}
.web-wrap.speaking .energy-pulse { opacity: 1; }

/* Spectrum bars — 32 radial rectangles around core, pulse with amplitude */
.spec-bar {
  fill: var(--accent);
  opacity: 0.8;
  transition: opacity .3s;
}
.web-wrap:not(.speaking) .spec-bar { opacity: 0; }

/* Radial scanline sweep */
.scan-sweep {
  transform-origin: 100px 100px;
  animation: rotate-cw 3.5s linear infinite;
  opacity: 0.4;
}
.web-wrap.speaking .scan-sweep { animation-duration: 1.3s; opacity: 0.75; }

/* Hexagonal plasma core */
.web-core {
  fill: url(#core-gradient);
  filter: url(#core-glow);
  transform-origin: 100px 100px;
}
.web-core-ring {
  fill: none;
  stroke: var(--accent);
  stroke-width: 1.5;
  opacity: 0.8;
  transform-origin: 100px 100px;
}
.web-wrap.speaking   .web-core      { animation: core-speak .6s ease-in-out infinite; }
.web-wrap.speaking   .web-core-ring { animation: core-ring-pulse .6s ease-in-out infinite; }
.web-wrap.listening  .web-core      { animation: core-listen 1.1s ease-in-out infinite; }
.web-wrap.processing .web-core      { animation: core-speak .5s ease-in-out infinite; }

/* Active state enhancements */
.web-wrap.speaking .web-spoke { opacity: 1;   stroke-width: 1.2; animation: spoke-pulse 1s ease-in-out infinite; }
.web-wrap.speaking .web-ring  { opacity: 0.8; stroke-width: 1;   animation: ring-pulse 2s ease-in-out infinite;  }
.web-wrap.speaking .web-node  { opacity: 1; animation: node-twinkle .9s ease-in-out infinite; }

.web-wrap.listening  .web-spoke, .web-wrap.listening  .web-ring { opacity: 0.55; }
.web-wrap.listening  .web-node  { opacity: 0.9; }
.web-wrap.processing .web-spoke, .web-wrap.processing .web-ring { opacity: 0.7; }

/* Animations */
@keyframes rotate-cw  { from { transform: rotate(0deg);   } to { transform: rotate(360deg);  } }
@keyframes rotate-ccw { from { transform: rotate(360deg); } to { transform: rotate(0deg);    } }
@keyframes spoke-pulse  { 0%,100% { opacity: 1;   stroke-width: 1.2; } 50% { opacity: 0.5; stroke-width: 0.6; } }
@keyframes ring-pulse   { 0%,100% { opacity: 0.85; stroke-dashoffset: 0;  } 50% { opacity: 0.35; stroke-dashoffset: 20; } }
@keyframes node-twinkle { 0%,100% { opacity: 1; r: 2.5; } 50% { opacity: 0.4; r: 1.3; } }
@keyframes core-speak   { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
@keyframes core-listen  { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.18); opacity: 1; } }
@keyframes core-ring-pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: 0.3; } }

/* Ripple rings — bigger, more of them */
.ripple {
  position: absolute;
  top: 50%; left: 50%;
  width: 40px; height: 40px;
  margin: -20px 0 0 -20px;
  border: 1.5px solid var(--accent);
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 0 12px rgba(var(--accent-rgb), .5);
}
.web-wrap.speaking .ripple { animation: ripple-expand 2.2s ease-out infinite; }
.web-wrap.speaking .ripple-2 { animation-delay: 0.55s; }
.web-wrap.speaking .ripple-3 { animation-delay: 1.10s; }
.web-wrap.speaking .ripple-4 { animation-delay: 1.65s; }

@keyframes ripple-expand {
  0%   { transform: scale(0.3); opacity: 0.9; }
  100% { transform: scale(4.5); opacity: 0;   }
}

/* Waveform */
.waveform {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: 30px;
  width: 100%;
}
.wave-bar {
  width: 3px;
  border-radius: 2px;
  background: var(--cyan);
  animation: wave-anim ease-in-out infinite;
}
@keyframes wave-anim {
  0%,100% { transform: scaleY(.2); opacity: .35; }
  50%     { transform: scaleY(1);  opacity: .9;  }
}

.model-indicator {
  font-size: 8px;
  color: var(--dim);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  opacity: .7;
}
.model-indicator .backend-tag {
  background: rgba(0,229,255,.12);
  color: var(--cyan);
  padding: 1px 5px;
  border-radius: 3px;
  margin-right: 4px;
}
.model-indicator .backend-tag.gemini { background: rgba(179,136,255,.15); color: var(--purple); }

/* ── CHAT ────────────────────────────────────────────────────────────────── */
.chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 2px; }

.bubble {
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid;
  animation: bubbleIn .2s ease;
}
.bubble.user     { background: #0d2035; border-color: #1a4060; }
.bubble.ai       { background: #071525; border-color: var(--border); }
.bubble.thinking { background: #071525; border-color: var(--border); opacity: .65; }

@keyframes bubbleIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.bubble-sender {
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 3px;
  text-transform: uppercase;
}
.bubble.user     .bubble-sender { color: var(--cyan);  }
.bubble.ai       .bubble-sender { color: var(--green); }
.bubble.thinking .bubble-sender { color: var(--dim);   }

.bubble-text { font-size: 11px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }

.bubble-text strong { color: var(--cyan); font-weight: bold; }
.bubble-text em { color: var(--purple); font-style: italic; }
.bubble-text code {
  background: rgba(0,229,255,.08);
  color: var(--green);
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 10px;
}
.bubble-text pre {
  background: #030d19;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px;
  margin: 6px 0;
  overflow-x: auto;
  font-size: 10px;
  white-space: pre;
}
.bubble-text pre code { background: none; padding: 0; color: var(--text); }

.thinking-dots::after { content: '▌'; animation: blink 1s step-start infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── QUICK ACTIONS ────────────────────────────────────────────────────────── */
.quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

.quick-btn {
  background: #071a28;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--cyan);
  font-family: var(--mono);
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 9px 6px;
  cursor: pointer;
  transition: all .15s;
}
.quick-btn:hover { background: #0d2d42; border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,229,255,.25); }
.quick-btn:active { background: var(--cyan); color: var(--dark); }

/* ── Backend toggle + settings icon ───────────────────────────────────────── */
.backend-toggle {
  display: flex;
  align-items: center;
  gap: 4px;
  background: #071a28;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px;
}

.backend-btn {
  background: transparent;
  border: none;
  color: var(--dim);
  font-family: var(--mono);
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 4px 8px;
  cursor: pointer;
  border-radius: 3px;
  transition: all .15s;
}
.backend-btn.active.gemini {
  background: var(--purple);
  color: var(--dark);
  box-shadow: 0 0 8px rgba(179,136,255,.4);
}
.backend-btn.active.ollama {
  background: var(--cyan);
  color: var(--dark);
  box-shadow: 0 0 8px rgba(0,229,255,.4);
}
.backend-btn.active.groq {
  background: #ff7a2e;
  color: var(--dark);
  box-shadow: 0 0 8px rgba(255,122,46,.5);
}

.icon-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--dim);
  font-size: 14px;
  cursor: pointer;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
}
.icon-btn:hover { color: var(--cyan); border-color: var(--cyan); }

/* Listen toggle pill */
.listen-indicator {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 8px;
  color: var(--dim);
  padding: 3px 7px;
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all .2s;
}
.listen-indicator.on { color: var(--green); border-color: var(--green); }
.listen-indicator.on .listen-dot { background: var(--green); animation: pulse-dot 1.5s ease-in-out infinite; }
.listen-indicator .listen-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--dim);
}
@keyframes pulse-dot {
  0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,255,136,.7); }
  50%     { opacity: 0.5; box-shadow: 0 0 0 4px rgba(0,255,136,0); }
}

/* ── REMINDERS / NOTES ───────────────────────────────────────────────────── */
.rem-form, .note-form { display: flex; gap: 4px; margin-bottom: 8px; }

input[type="text"], input[type="password"], select {
  background: #071a28;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 10px;
  padding: 5px 7px;
  outline: none;
  transition: border-color .2s;
}
input:focus { border-color: var(--cyan); }
input::placeholder { color: var(--dim); opacity: .5; }

select { cursor: pointer; -webkit-appearance: none; appearance: none; padding-right: 12px; }
select option { background: var(--panel); color: var(--text); }

.rem-time-in { width: 62px; }
.rem-text-in, .note-text-in { flex: 1; }

.rem-add, .note-add {
  background: var(--cyan);
  border: none;
  border-radius: 4px;
  color: var(--dark);
  font-weight: bold;
  font-size: 16px;
  width: 28px;
  cursor: pointer;
  flex-shrink: 0;
}
.rem-add:hover, .note-add:hover { background: #33eeff; }

.rem-list, .note-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }

.rem-item, .note-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 9px;
  padding: 5px 7px;
  background: rgba(13,58,82,.18);
  border: 1px solid rgba(13,58,82,.35);
  border-radius: 3px;
}
.rem-item span, .note-item span { flex: 1; letter-spacing: .3px; }
.note-item .note-date { font-size: 8px; color: var(--dim); white-space: nowrap; flex: 0; }

.rem-del, .note-del {
  background: var(--red);
  border: none;
  border-radius: 3px;
  color: white;
  font-weight: bold;
  font-size: 12px;
  width: 18px;
  height: 18px;
  cursor: pointer;
  flex-shrink: 0;
}

/* ── INPUT BAR ───────────────────────────────────────────────────────────── */
.input-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: #030d19;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.mic-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #071a28;
  border: 1px solid var(--border);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all .2s;
}
.mic-btn:hover   { border-color: var(--cyan); }
.mic-btn.active  { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 16px rgba(0,229,255,.55); }

#cmd-input { flex: 1; height: 38px; font-size: 12px; padding: 0 12px; }

.send-btn {
  height: 38px;
  padding: 0 20px;
  background: #0d3a80;
  border: 1px solid var(--cyan);
  border-radius: 4px;
  color: var(--cyan);
  font-family: var(--mono);
  font-weight: bold;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  flex-shrink: 0;
}
.send-btn:hover { background: var(--cyan); color: var(--dark); }

/* ── SETTINGS MODAL ──────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(2,11,20,.85);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9998;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--panel);
  border: 1px solid var(--cyan);
  border-radius: 8px;
  padding: 20px;
  width: 460px;
  max-width: 90vw;
  position: relative;
  box-shadow: 0 0 30px rgba(0,229,255,.15);
}

.modal-title {
  font-family: var(--head);
  font-size: 14px;
  letter-spacing: 3px;
  color: var(--cyan);
  text-transform: uppercase;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-close {
  background: transparent;
  border: none;
  color: var(--dim);
  font-size: 20px;
  cursor: pointer;
}
.modal-close:hover { color: var(--red); }

.field-group { margin-bottom: 14px; }
.field-label {
  display: block;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--dim);
  text-transform: uppercase;
  margin-bottom: 5px;
}
.field-label .hint { color: var(--cyan); opacity: .7; font-size: 8px; margin-left: 6px; }

.field-group input, .field-group select {
  width: 100%;
  padding: 8px 10px;
  font-size: 11px;
}

.field-check {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  cursor: pointer;
}
.field-check input { width: auto; cursor: pointer; transform: scale(1.2); accent-color: var(--cyan); }

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 18px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.modal-btn {
  padding: 8px 16px;
  border-radius: 4px;
  font-family: var(--mono);
  font-weight: bold;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  border: 1px solid;
  transition: all .15s;
}
.modal-btn.primary {
  background: var(--cyan);
  color: var(--dark);
  border-color: var(--cyan);
}
.modal-btn.primary:hover { background: #33eeff; }
.modal-btn.secondary {
  background: transparent;
  color: var(--dim);
  border-color: var(--border);
}
.modal-btn.secondary:hover { color: var(--cyan); border-color: var(--cyan); }

.api-link {
  display: inline-block;
  font-size: 9px;
  color: var(--cyan);
  text-decoration: none;
  margin-top: 4px;
}
.api-link:hover { text-decoration: underline; }

/* ── Scrollbars ───────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--dim); }
</style>
</head>
<body>
<div class="root">

  <div class="content">

    <!-- LEFT PANEL -->
    <div class="panel">
      <div class="card">
        <div class="card-title">System Metrics</div>
        <div class="stat-bar">
          <div class="stat-label">CPU <b id="cpu-val">0%</b></div>
          <div class="stat-track"><div class="stat-fill" id="cpu-fill" style="width:0%"></div></div>
        </div>
        <div class="stat-bar">
          <div class="stat-label">RAM <b id="ram-val">— GB</b></div>
          <div class="stat-track"><div class="stat-fill" id="ram-fill" style="width:0%"></div></div>
        </div>
        <div class="stat-bar">
          <div class="stat-label">DISK <b id="disk-val">— GB</b></div>
          <div class="stat-track"><div class="stat-fill" id="disk-fill" style="width:0%"></div></div>
        </div>
        <div class="info-row" id="net-row">NET  ↑ 0 KB/s  ↓ 0 KB/s</div>
        <div class="info-row" id="os-row">OS  —</div>
        <div class="battery-row" id="batt-row" style="display:none">
          <span class="battery-icon">🔋</span>
          <span id="batt-val">—</span>
        </div>
      </div>

      <div class="card fill">
        <div class="card-title">Activity Log</div>
        <div class="log-list" id="log-list"></div>
      </div>
    </div>

    <!-- CENTER PANEL: Web orb + chat -->
    <div class="panel">
      <div class="card orb-card">
        <div class="web-wrap" id="web-wrap">
          <!-- Background halo -->
          <div class="web-halo"></div>

          <!-- Expanding ripples (shown when speaking) -->
          <div class="ripple ripple-1"></div>
          <div class="ripple ripple-2"></div>
          <div class="ripple ripple-3"></div>
          <div class="ripple ripple-4"></div>

          <!-- Main SVG canvas 200x200 -->
          <svg class="web-svg" viewBox="0 0 200 200" id="web-svg">
            <defs>
              <radialGradient id="core-gradient" cx="50%" cy="50%" r="50%">
                <stop offset="0%"  stop-color="currentColor" stop-opacity="1"/>
                <stop offset="50%" stop-color="currentColor" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
              </radialGradient>
              <radialGradient id="sweep-gradient" cx="50%" cy="50%" r="50%">
                <stop offset="0%"  stop-color="currentColor" stop-opacity="0"/>
                <stop offset="60%" stop-color="currentColor" stop-opacity="0.15"/>
                <stop offset="95%" stop-color="currentColor" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
              </radialGradient>
              <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
              <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
              <!-- Hexagon for the core -->
              <polygon id="hex"
                points="0,-8 6.93,-4 6.93,4 0,8 -6.93,4 -6.93,-4"/>
            </defs>

            <!-- Radial scan sweep (rotating wedge) -->
            <g class="scan-sweep" color="currentColor" style="color: var(--accent);">
              <path d="M 100 100 L 100 10 A 90 90 0 0 1 180 70 Z"
                    fill="url(#sweep-gradient)" opacity=".6"/>
            </g>

            <!-- OUTER HUD — tick marks + ring (rotates CCW) -->
            <g class="hud-outer" id="hud-outer"></g>

            <!-- INNER HUD — four corner brackets (rotates CW) -->
            <g class="hud-inner" id="hud-inner"></g>

            <!-- WEB — spokes, rings, nodes, morphing arcs (rotates CW, slow) -->
            <g class="web-rotate-group">
              <g id="web-spokes"></g>
              <g id="web-rings"></g>
              <g id="web-arcs"></g>
              <g id="web-nodes"></g>
            </g>

            <!-- Energy pulses traveling along spokes — driven by rAF -->
            <g id="web-pulses"></g>

            <!-- 32-bar spectrum ring around the core (shown when speaking) -->
            <g id="spec-bars"></g>

            <!-- Hexagonal plasma core -->
            <g style="color: var(--accent);">
              <circle class="web-core-ring" cx="100" cy="100" r="14"/>
              <use class="web-core" href="#hex" x="100" y="100"
                   style="color: var(--accent);" fill="url(#core-gradient)"/>
              <circle cx="100" cy="100" r="3" fill="#fff" opacity="0.9" filter="url(#soft-glow)"/>
            </g>
          </svg>
        </div>

        <div class="waveform" id="waveform"></div>

        <div class="model-indicator">
          <span class="backend-tag" id="backend-tag">—</span>
          <span id="model-indicator-text">MODEL: —</span>
        </div>
      </div>

      <div class="card fill">
        <div class="card-title">Communications</div>
        <div class="chat-messages" id="chat"></div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="panel">
      <div class="card">
        <div class="card-title">
          <span>Control</span>
          <div style="display:flex; gap:6px; align-items:center;">
            <div class="backend-toggle">
              <button class="backend-btn groq active"   id="btn-groq"   onclick="switchBackend('groq')">Groq</button>
              <button class="backend-btn gemini"        id="btn-gemini" onclick="switchBackend('gemini')">Gemini</button>
              <button class="backend-btn ollama"        id="btn-ollama" onclick="switchBackend('ollama')">Ollama</button>
            </div>
            <button class="icon-btn" onclick="openSettings()" title="Settings">⚙</button>
          </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <div class="listen-indicator" id="listen-indicator" onclick="toggleAlwaysListen()">
            <div class="listen-dot"></div>
            <span id="listen-text">24/7 OFF</span>
          </div>
          <select class="" style="font-size:9px; padding:3px 6px; max-width:130px;" id="model-select" onchange="switchModel(this.value)">
          </select>
        </div>

        <div class="quick-grid">
          <button class="quick-btn" onclick="sendCmd('stats')">📊 Stats</button>
          <button class="quick-btn" onclick="sendCmd('open chrome')">🌐 Chrome</button>
          <button class="quick-btn" onclick="sendCmd('open terminal')">⌨ Terminal</button>
          <button class="quick-btn" onclick="sendCmd('files')">📁 Files</button>
          <button class="quick-btn" onclick="sendCmd('open vscode')">💻 VS Code</button>
          <button class="quick-btn" onclick="sendCmd('screenshot')">📸 Screen</button>
          <button class="quick-btn" onclick="sendCmd('clipboard')">📋 Clip</button>
          <button class="quick-btn" onclick="sendCmd('help')">❓ Help</button>
        </div>
      </div>

      <div class="card fill">
        <div class="tab-bar">
          <button class="tab-btn active" onclick="switchTab('reminders', this)">⏰ Reminders</button>
          <button class="tab-btn" onclick="switchTab('notes', this)">📝 Notes</button>
        </div>

        <div class="tab-content active" id="tab-reminders">
          <div class="rem-form">
            <input type="text" class="rem-time-in" id="rem-t" placeholder="HH:MM" maxlength="5">
            <input type="text" class="rem-text-in" id="rem-x" placeholder="Reminder text..."
                   onkeydown="if(event.key==='Enter') addReminder()">
            <button class="rem-add" onclick="addReminder()">+</button>
          </div>
          <div class="rem-list" id="rem-list"></div>
        </div>

        <div class="tab-content" id="tab-notes">
          <div class="note-form">
            <input type="text" class="note-text-in" id="note-text" placeholder="Quick note..."
                   onkeydown="if(event.key==='Enter') addNote()">
            <button class="note-add" onclick="addNote()">+</button>
          </div>
          <div class="note-list" id="note-list"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Input bar -->
  <div class="input-bar">
    <button class="mic-btn" id="mic-btn" onclick="toggleMic()">🎤</button>
    <input type="text" id="cmd-input"
           placeholder="Ask T.M.O.S anything... (or say 'TMOS' to activate)"
           onkeydown="if(event.key==='Enter') doSend()">
    <button class="send-btn" onclick="doSend()">Send</button>
  </div>

</div>

  <div class="modal">
    <div class="modal-title">
      <span>◈  Settings</span>
      <button class="modal-close" onclick="closeSettings()">✕</button>

    <div class="field-group">

<script>
'use strict';

// ══════════════════════════════════════════════════════════════════════════
//  SCI-FI ORB — HUD rings, web, arcs, energy pulses, spectrum ring
// ══════════════════════════════════════════════════════════════════════════
const SVG_NS = 'http://www.w3.org/2000/svg';
const ORB = (() => {
  const cx = 100, cy = 100;
  const SPOKES = 16;
  const RING_RADII = [28, 46, 64, 82];
  const OUTER_R = 92;
  const el = id => document.getElementById(id);

  // ── OUTER HUD: 60 ticks + major every 15 + outer ring ─────────────────
  (function buildHudOuter() {
    const g = el('hud-outer');
    // outer dashed ring
    const ring = document.createElementNS(SVG_NS, 'circle');
    ring.setAttribute('cx', cx); ring.setAttribute('cy', cy); ring.setAttribute('r', OUTER_R);
    ring.classList.add('hud-outer-ring');
    g.appendChild(ring);
    for (let i = 0; i < 60; i++) {
      const ang = (i / 60) * Math.PI * 2;
      const major = i % 15 === 0;
      const r1 = major ? OUTER_R - 8 : OUTER_R - 3;
      const r2 = OUTER_R;
      const tick = document.createElementNS(SVG_NS, 'line');
      tick.setAttribute('x1', cx + Math.cos(ang) * r1);
      tick.setAttribute('y1', cy + Math.sin(ang) * r1);
      tick.setAttribute('x2', cx + Math.cos(ang) * r2);
      tick.setAttribute('y2', cy + Math.sin(ang) * r2);
      tick.classList.add('hud-tick');
      if (major) tick.classList.add('hud-tick-major');
      g.appendChild(tick);
    }
  })();

  // ── INNER HUD: four corner brackets ──────────────────────────────────
  (function buildHudInner() {
    const g = el('hud-inner');
    const R = 74;
    const span = 0.18; // radians of each bracket arc
    for (let k = 0; k < 4; k++) {
      const base = k * Math.PI / 2 + Math.PI / 4;
      const a1 = base - span, a2 = base + span;
      const x1 = cx + Math.cos(a1) * R, y1 = cy + Math.sin(a1) * R;
      const x2 = cx + Math.cos(a2) * R, y2 = cy + Math.sin(a2) * R;
      const arc = document.createElementNS(SVG_NS, 'path');
      arc.setAttribute('d', `M ${x1} ${y1} A ${R} ${R} 0 0 1 ${x2} ${y2}`);
      arc.classList.add('hud-bracket');
      g.appendChild(arc);
      // tail marks
      [[a1, -1], [a2, 1]].forEach(([a, dir]) => {
        const ix = cx + Math.cos(a) * R, iy = cy + Math.sin(a) * R;
        const ox = cx + Math.cos(a) * (R + 5 * dir), oy = cy + Math.sin(a) * (R + 5 * dir);
        const t = document.createElementNS(SVG_NS, 'line');
        t.setAttribute('x1', ix); t.setAttribute('y1', iy);
        t.setAttribute('x2', ox); t.setAttribute('y2', oy);
        t.classList.add('hud-bracket');
        g.appendChild(t);
      });
    }
  })();

  // ── WEB SPOKES ───────────────────────────────────────────────────────
  const spokesG = el('web-spokes');
  const spokeEndpoints = []; // [{x, y}]
  for (let i = 0; i < SPOKES; i++) {
    const ang = (i / SPOKES) * Math.PI * 2;
    const ex = cx + Math.cos(ang) * OUTER_R;
    const ey = cy + Math.sin(ang) * OUTER_R;
    spokeEndpoints.push({ x: ex, y: ey, ang });
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', cx); line.setAttribute('y1', cy);
    line.setAttribute('x2', ex); line.setAttribute('y2', ey);
    line.classList.add('web-spoke');
    line.style.animationDelay = (i * 0.06) + 's';
    spokesG.appendChild(line);
  }

  // ── CONCENTRIC RINGS ─────────────────────────────────────────────────
  const ringsG = el('web-rings');
  RING_RADII.forEach((r, i) => {
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
    c.classList.add('web-ring');
    c.style.animationDelay = (i * 0.25) + 's';
    ringsG.appendChild(c);
  });

  // ── NODES at sparse intersections ────────────────────────────────────
  const nodesG = el('web-nodes');
  const nodePoints = [];
  for (let i = 0; i < SPOKES; i++) {
    const ang = (i / SPOKES) * Math.PI * 2;
    RING_RADII.forEach((r, ri) => {
      if ((i + ri) % 2 === 0) {
        const x = cx + Math.cos(ang) * r;
        const y = cy + Math.sin(ang) * r;
        nodePoints.push({ x, y });
        const n = document.createElementNS(SVG_NS, 'circle');
        n.setAttribute('cx', x); n.setAttribute('cy', y); n.setAttribute('r', 2);
        n.classList.add('web-node');
        n.style.animationDelay = ((i + ri) * 0.08) + 's';
        nodesG.appendChild(n);
      }
    });
  }

  // ── BEZIER ARCS between random node pairs (morphing every few seconds)
  const arcsG = el('web-arcs');
  const ARC_COUNT = 6;
  const arcPaths = [];
  for (let i = 0; i < ARC_COUNT; i++) {
    const p = document.createElementNS(SVG_NS, 'path');
    p.classList.add('web-arc');
    arcsG.appendChild(p);
    arcPaths.push(p);
  }
  function randArc() {
    const a = nodePoints[Math.floor(Math.random() * nodePoints.length)];
    let b = nodePoints[Math.floor(Math.random() * nodePoints.length)];
    if (b === a) b = nodePoints[(nodePoints.indexOf(a) + 3) % nodePoints.length];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    // pull midpoint toward center for curve
    const ctrlX = mx + (cx - mx) * 0.45;
    const ctrlY = my + (cy - my) * 0.45;
    return `M ${a.x} ${a.y} Q ${ctrlX} ${ctrlY} ${b.x} ${b.y}`;
  }
  function reseedArcs() {
    arcPaths.forEach(p => p.setAttribute('d', randArc()));
  }
  reseedArcs();
  setInterval(reseedArcs, 2800);

  // ── ENERGY PULSES: particles travelling along spokes (when speaking) ──
  const pulsesG = el('web-pulses');
  const PULSE_COUNT = 8;
  const pulses = [];
  for (let i = 0; i < PULSE_COUNT; i++) {
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('r', 2.2);
    c.classList.add('energy-pulse');
    pulsesG.appendChild(c);
    pulses.push({
      el: c,
      spoke: Math.floor(Math.random() * SPOKES),
      t: Math.random(),
      speed: 0.4 + Math.random() * 0.6,
    });
  }

  // ── SPECTRUM BARS: 32 radial rectangles around core ──────────────────
  const specG = el('spec-bars');
  const SPEC_COUNT = 32;
  const INNER_R = 16, BAR_W = 1.6;
  const specBars = [];
  for (let i = 0; i < SPEC_COUNT; i++) {
    const ang = (i / SPEC_COUNT) * Math.PI * 2;
    const rect = document.createElementNS(SVG_NS, 'rect');
    rect.setAttribute('x', -BAR_W / 2);
    rect.setAttribute('y', 0);
    rect.setAttribute('width', BAR_W);
    rect.setAttribute('height', 3);
    rect.setAttribute('rx', BAR_W / 2);
    rect.classList.add('spec-bar');
    // position rectangle: translate to inner ring edge, rotate so it points outward
    const deg = ang * 180 / Math.PI + 90;
    rect.setAttribute('transform',
      `translate(${cx + Math.cos(ang) * INNER_R} ${cy + Math.sin(ang) * INNER_R}) rotate(${deg})`);
    specG.appendChild(rect);
    specBars.push({ el: rect, ang, phase: Math.random() * Math.PI * 2, base: { ix: cx + Math.cos(ang) * INNER_R, iy: cy + Math.sin(ang) * INNER_R, deg } });
  }

  // ── rAF LOOP: drive pulses + spectrum ────────────────────────────────
  const wrap = document.getElementById('web-wrap');
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    const speaking = wrap.classList.contains('speaking');
    const listening = wrap.classList.contains('listening');

    // Energy pulses — only visible when speaking but always animate
    pulses.forEach(p => {
      p.t += dt * p.speed;
      if (p.t > 1) {
        p.t = 0;
        p.spoke = Math.floor(Math.random() * SPOKES);
        p.speed = 0.4 + Math.random() * 0.7;
      }
      const end = spokeEndpoints[p.spoke];
      // ease-out from center
      const k = 1 - Math.pow(1 - p.t, 2);
      const x = cx + (end.x - cx) * k;
      const y = cy + (end.y - cy) * k;
      p.el.setAttribute('cx', x);
      p.el.setAttribute('cy', y);
      p.el.setAttribute('opacity', speaking ? (1 - p.t) : 0);
      p.el.setAttribute('r', speaking ? (2.5 - p.t * 1.5) : 0);
    });

    // Spectrum bars — simulate amplitude with layered sines + noise
    const t = now / 1000;
    specBars.forEach((b, i) => {
      let amp = 0;
      if (speaking) {
        // multi-freq pseudo-audio envelope
        amp = 0.5 + 0.5 * Math.sin(t * 6 + b.phase);
        amp *= 0.6 + 0.4 * Math.sin(t * 2.3 + i * 0.4);
        amp = Math.max(0.08, amp);
        amp = 3 + amp * 18;
      } else if (listening) {
        amp = 3 + 1.5 * Math.sin(t * 3 + b.phase);
      } else {
        amp = 2;
      }
      b.el.setAttribute('height', amp.toFixed(1));
      b.el.setAttribute('opacity', speaking ? 0.85 : (listening ? 0.35 : 0));
    });

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  return { reseedArcs };
})();

const WF = [6,10,16,22,30,36,28,18,10,14,24,34,40,32,22,14,8,12,20,28,36,30,20,12,8];
const wf = document.getElementById('waveform');
WF.forEach((h, i) => {
  const b = document.createElement('div');
  b.className = 'wave-bar';
  b.style.cssText = `height:${h}px;animation-duration:${(.85 + (i % 7) * .12).toFixed(2)}s;animation-delay:${((i * .09) % 1).toFixed(2)}s`;
  wf.appendChild(b);
});

// ══════════════════════════════════════════════════════════════════════════
//  BRIDGE
// ══════════════════════════════════════════════════════════════════════════
let bridge = null;
let _streamBubble = null;
let _currentBackend = 'gemini';

new QWebChannel(qt.webChannelTransport, ch => {
  bridge = ch.objects.bridge;

  bridge.stats_pushed.connect(json  => updateStats(JSON.parse(json)));
  bridge.chat_pushed.connect((t, u) => addBubble(t, u ? 'user' : 'ai'));
  bridge.log_pushed.connect((t, tp) => addLog(t, tp));
  bridge.thinking_on.connect(showThinking);
  bridge.thinking_off.connect(hideThinking);
  bridge.reminders_pushed.connect(j => renderReminders(JSON.parse(j)));
  bridge.notes_pushed.connect(j => renderNotes(JSON.parse(j)));
  bridge.reminder_fired.connect(j => {
    const r = JSON.parse(j);
    addBubble('⏰  Reminder: ' + r.text, 'ai');
    addLog('REMINDER: ' + r.text, 'warn');
  });
  bridge.mic_state_pushed.connect(on => {
    document.getElementById('mic-btn').classList.toggle('active', on);
    document.getElementById('web-wrap').classList.toggle('listening', on);
  });
  bridge.model_pushed.connect(m => {
    const sel = document.getElementById('model-select');
    sel.value = m;
    document.getElementById('model-indicator-text').textContent = 'MODEL: ' + m.toUpperCase();
  });
  bridge.backend_pushed.connect(b => {
    _currentBackend = b;
    document.getElementById('btn-groq').classList.toggle('active',   b === 'groq');
    document.getElementById('btn-gemini').classList.toggle('active', b === 'gemini');
    document.getElementById('btn-ollama').classList.toggle('active', b === 'ollama');
    const tag = document.getElementById('backend-tag');
    if (tag) {
      tag.textContent = b.toUpperCase();
      tag.classList.toggle('gemini', b === 'gemini');
      tag.classList.toggle('groq',   b === 'groq');
    }
    rebuildModelDropdown(b);
  });
  bridge.config_pushed.connect(j => {
    const c = JSON.parse(j);
    document.getElementById('cfg-wake').value = c.wake_word || 'tmos';
    document.getElementById('cfg-listen').checked = !!c.always_listen;
    updateListenIndicator(!!c.always_listen);
  });
  bridge.wake_detected.connect(() => {
    document.getElementById('web-wrap').classList.add('listening');
    setTimeout(() => document.getElementById('web-wrap').classList.remove('listening'), 1500);
  });
  bridge.speaking_pushed.connect(on => {
    document.getElementById('web-wrap').classList.toggle('speaking', on);
  });

  bridge.ai_token.connect(token => {
    if (!_streamBubble) {
      hideThinking();
      _streamBubble = addBubble('', 'ai');
    }
    const textEl = _streamBubble.querySelector('.bubble-text');
    textEl._raw = (textEl._raw || '') + token;
    textEl.innerHTML = renderMd(textEl._raw);
    const chat = document.getElementById('chat');
    chat.scrollTop = chat.scrollHeight;
  });

  bridge.ai_stream_done.connect(() => {
    if (_streamBubble) {
      const textEl = _streamBubble.querySelector('.bubble-text');
      textEl.innerHTML = renderMd(textEl._raw || '');
    }
    _streamBubble = null;
    document.getElementById('web-wrap').classList.remove('processing');
  });

  addLog('Interface ready', 'ok');
});

// ══════════════════════════════════════════════════════════════════════════
//  MARKDOWN
// ══════════════════════════════════════════════════════════════════════════
function renderMd(s) {
  s = esc(s);
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  s = s.replace(/\n/g, '<br>');
  return s;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ══════════════════════════════════════════════════════════════════════════
//  STATS
// ══════════════════════════════════════════════════════════════════════════
function updateStats(s) {
  const { cpu, ram, disk, network: n = {}, os: o, battery: batt } = s;
  setBar('cpu',  cpu.percent,  cpu.percent + '%');
  setBar('ram',  ram.percent,  ram.used + '/' + ram.total + ' GB');
  setBar('disk', disk.percent, disk.used + '/' + disk.total + ' GB');
  document.getElementById('net-row').textContent =
    'NET  ↑ ' + (n.upload||0) + ' KB/s  ↓ ' + (n.download||0) + ' KB/s';
  document.getElementById('os-row').textContent =
    o.platform + ' ' + (o.release||'') + '  ⏱ ' + o.uptime + 'h';

  const battRow = document.getElementById('batt-row');
  if (batt) {
    battRow.style.display = 'flex';
    document.querySelector('.battery-icon').textContent = batt.plugged ? '⚡' : (batt.percent < 20 ? '🪫' : '🔋');
    let text = batt.percent + '%';
    if (batt.plugged) text += '  (charging)';
    document.getElementById('batt-val').textContent = text;
  } else {
    battRow.style.display = 'none';
  }
}

function setBar(id, pct, label) {
  const fill = document.getElementById(id + '-fill');
  const val  = document.getElementById(id + '-val');
  fill.style.width = Math.min(100, Math.max(0, pct)) + '%';
  val.textContent  = label;
  fill.className = 'stat-fill' + (pct > 85 ? ' high' : pct > 65 ? ' warn' : '');
}

// ══════════════════════════════════════════════════════════════════════════
//  CHAT
// ══════════════════════════════════════════════════════════════════════════
let _thinking = null;

function addBubble(text, cls) {
  const el = document.getElementById('chat');
  const d  = document.createElement('div');
  d.className = 'bubble ' + cls;
  const sender = cls === 'user' ? 'YOU' : 'T.M.O.S';
  const rendered = cls === 'user' ? esc(text) : renderMd(text);
  d.innerHTML  =
    `<div class="bubble-sender">${sender}</div>` +
    `<div class="bubble-text">${rendered}</div>`;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
  return d;
}

function showThinking() {
  const el = document.getElementById('chat');
  _thinking = document.createElement('div');
  _thinking.className = 'bubble thinking';
  _thinking.innerHTML =
    '<div class="bubble-sender" style="color:var(--dim)">T.M.O.S</div>' +
    '<div class="bubble-text" style="color:var(--dim)"><span class="thinking-dots">thinking</span></div>';
  el.appendChild(_thinking);
  el.scrollTop = el.scrollHeight;
  document.getElementById('web-wrap').classList.add('processing');
}

function hideThinking() {
  if (_thinking) { _thinking.remove(); _thinking = null; }
}

// ══════════════════════════════════════════════════════════════════════════
//  LOG
// ══════════════════════════════════════════════════════════════════════════
const TAGS = { sys:'SYS', ok:'OK', warn:'WARN', err:'ERR' };
const logEl = document.getElementById('log-list');

function addLog(text, type = 'sys') {
  const d = document.createElement('div');
  d.className = 'log-entry';
  const ts = new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  d.innerHTML = `<span style="color:var(--dim);opacity:.5">${ts}</span> <span class="tag-${type}">[${TAGS[type]||'SYS'}]</span> ${esc(text)}`;
  logEl.appendChild(d);
  while (logEl.children.length > 50) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}

// ══════════════════════════════════════════════════════════════════════════
//  TABS
// ══════════════════════════════════════════════════════════════════════════
function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

// ══════════════════════════════════════════════════════════════════════════
//  REMINDERS / NOTES
// ══════════════════════════════════════════════════════════════════════════
function renderReminders(list) {
  const el = document.getElementById('rem-list');
  el.innerHTML = '';
  list.forEach(r => {
    const row = document.createElement('div');
    row.className = 'rem-item';
    row.innerHTML =
      `<span>⏰  <b style="color:var(--cyan)">${esc(r.time)}</b>  ${esc(r.text)}</span>` +
      `<button class="rem-del" onclick="bridge.del_reminder('${r.id}')">×</button>`;
    el.appendChild(row);
  });
}

function addReminder() {
  const t = document.getElementById('rem-t').value.trim();
  const x = document.getElementById('rem-x').value.trim();
  if (!t || !x || !bridge) return;
  bridge.add_reminder(t, x);
  document.getElementById('rem-t').value = '';
  document.getElementById('rem-x').value = '';
}

function renderNotes(list) {
  const el = document.getElementById('note-list');
  el.innerHTML = '';
  list.slice().reverse().forEach(n => {
    const row = document.createElement('div');
    row.className = 'note-item';
    row.innerHTML =
      `<span>${esc(n.text)}</span>` +
      `<span class="note-date">${esc(n.created || '')}</span>` +
      `<button class="note-del" onclick="bridge.del_note('${n.id}')">×</button>`;
    el.appendChild(row);
  });
}

function addNote() {
  const text = document.getElementById('note-text').value.trim();
  if (!text || !bridge) return;
  bridge.add_note(text);
  document.getElementById('note-text').value = '';
}

const GROQ_MODELS = {
  'llama-3.3-70b-versatile': 'Llama 3.3 70B',
  'llama-3.1-8b-instant':    'Llama 3.1 8B',
  'qwen/qwen3-32b':          'Qwen 3 32B',
  'moonshotai/kimi-k2-instruct': 'Kimi K2',
  'meta-llama/llama-4-scout-17b-16e-instruct': 'Llama 4 Scout',
};

const GEMINI_MODELS = {
  'gemini-2.0-flash':      'Gemini 2.0 Flash',
  'gemini-2.0-flash-lite': 'Gemini 2.0 Flash-Lite',
  'gemini-1.5-flash':      'Gemini 1.5 Flash',
  'gemini-1.5-pro':        'Gemini 1.5 Pro',
};

const OLLAMA_MODELS = {
  'qwen2.5':  'Qwen 2.5',
  'llama3.3': 'Llama 3.3',
  'mistral':  'Mistral 7B',
  'phi4':     'Phi-4',
  'gemma3':   'Gemma 3',
  'llama3':   'Llama 3',
};

function rebuildModelDropdown(backend) {
  const sel = document.getElementById('model-select');
  const models = backend === 'groq'   ? GROQ_MODELS   :
                 backend === 'gemini' ? GEMINI_MODELS : OLLAMA_MODELS;
  sel.innerHTML = '';
  for (const [k, v] of Object.entries(models)) {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = v;
    sel.appendChild(opt);
  }
}
rebuildModelDropdown('groq');  // default

function switchBackend(b) {
  if (bridge) bridge.switch_backend(b);
}

function switchModel(m) {
  if (bridge) bridge.switch_model(m);
}

// ══════════════════════════════════════════════════════════════════════════
//  ALWAYS-LISTEN
// ══════════════════════════════════════════════════════════════════════════
let _alwaysListen = false;

function toggleAlwaysListen() {
  _alwaysListen = !_alwaysListen;
  if (bridge) bridge.toggle_always_listen(_alwaysListen);
  updateListenIndicator(_alwaysListen);
}

function updateListenIndicator(on) {
  _alwaysListen = on;
  const ind = document.getElementById('listen-indicator');
  ind.classList.toggle('on', on);
  document.getElementById('listen-text').textContent = on ? '24/7 LISTENING' : '24/7 OFF';
}

// ══════════════════════════════════════════════════════════════════════════
//  SETTINGS MODAL
// ══════════════════════════════════════════════════════════════════════════
function openSettings() {
  document.getElementById('settings-modal').classList.add('open');
  document.getElementById('cfg-api-key').focus();
}

function closeSettings() {
  document.getElementById('settings-modal').classList.remove('open');
}

function saveSettings() {
  const gemKey  = document.getElementById('cfg-api-key').value.trim();
  const groqKey = document.getElementById('cfg-groq-key').value.trim();
  const wake = document.getElementById('cfg-wake').value.trim() || 'tmos';
  const listen = document.getElementById('cfg-listen').checked;

  if (bridge) {
    if (groqKey) bridge.save_groq_key(groqKey);
    if (gemKey)  bridge.save_gemini_key(gemKey);
    bridge.set_wake_word(wake);
    bridge.toggle_always_listen(listen);
    updateListenIndicator(listen);
  }
  closeSettings();
}

function openExternal(url) {
  if (bridge) bridge.send_command('browse ' + url);
}

// ══════════════════════════════════════════════════════════════════════════
//  COMMANDS
// ══════════════════════════════════════════════════════════════════════════
function sendCmd(cmd) { if (bridge) bridge.send_command(cmd); }

function doSend() {
  const inp = document.getElementById('cmd-input');
  const cmd = inp.value.trim();
  if (!cmd || !bridge) return;
  inp.value = '';
  bridge.send_command(cmd);
}

function toggleMic() { if (bridge) bridge.toggle_mic(); }

// ══════════════════════════════════════════════════════════════════════════
//  KEYBOARD SHORTCUTS
// ══════════════════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'm') { e.preventDefault(); toggleMic(); }
  if (e.ctrlKey && e.key === 'l') { e.preventDefault(); document.getElementById('cmd-input').focus(); }
  if (e.ctrlKey && e.key === ',') { e.preventDefault(); openSettings(); }
  if (e.key === 'Escape') {
    if (document.getElementById('settings-modal').classList.contains('open')) closeSettings();
    else document.getElementById('cmd-input').value = '';
  }
});
</script>
